version: '3.8'

services:
  postgres-db:
    build: .
    container_name: enterprise-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: enterprise_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - enterprise-network

volumes:
  postgres_data:

networks:
  enterprise-network:
    driver: bridge